spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt-secret=${JWT_SECRET}
app.demo-password=${DEMO_PASSWORD}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
