services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seguros_db
      POSTGRES_USER: seguros_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguros_user -d seguros_db"]
      interval: 5s
      retries: 15
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seguros_db
      DB_USER: seguros_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Define DEMO_PASSWORD en .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
